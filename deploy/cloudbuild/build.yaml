{
  "steps": [
    {
      "name": "docker.io/library/docker@sha256:b0d99f37f463c88cae2082083f705210296186c06632d22f6952ed43506ae520",
      "entrypoint": "sh",
      "args": [
        "-ceu",
        "test \"$$(docker --version)\" = 'Docker version 29.9.3, build 5457199'\ncase \"$$(docker buildx version)\" in *' v0.38.2 3c4cbd35852fc1a476923627a780a7836c28b654') ;; *) exit 1 ;; esac\nbuilder=\"deskdrop-$BUILD_ID\"\nowned=false\ncleanup() {\n  status=$$?\n  trap - EXIT INT TERM\n  if [ \"$$owned\" = true ]; then\n    docker buildx rm --force \"$$builder\" || { [ \"$$status\" -ne 0 ] || status=1; }\n  fi\n  exit \"$$status\"\n}\ntrap cleanup EXIT\ntrap 'exit 130' INT\ntrap 'exit 143' TERM\ndocker buildx create --name \"$$builder\" --driver docker-container --driver-opt=image=docker.io/moby/buildkit@sha256:97719ccb2ac86fb44fd36f330a6d302f63dddd5326f3ada24f9c05ccac0d9098\nowned=true\ndocker buildx inspect --builder \"$$builder\" --bootstrap\nfor kind in app checker; do\n  file=Dockerfile\n  [ \"$$kind\" != checker ] || file=deploy/checker.Dockerfile\n  docker buildx build --builder \"$$builder\" --platform=linux/amd64 --provenance=false --build-arg SOURCE_COMMIT=${_SOURCE_COMMIT} --output type=oci,dest=/workspace/$$kind.oci.tar -f \"$$file\" .\ndone"
      ]
    },
    {
      "name": "node:24.13.0-bookworm-slim@sha256:46feb5752989c05b8606e6323fbbc3db667d14ade1c24f5d0d44d9ca9909d607",
      "entrypoint": "node",
      "args": [
        "scripts/demo/cloud-release.mjs",
        "worker-verify",
        "${_SOURCE_COMMIT}"
      ]
    }
  ],
  "artifacts": {
    "objects": {
      "location": "gs://se-demos-project-deskdrop-artifacts/${_SOURCE_COMMIT}/$BUILD_ID/",
      "paths": [
        "app.oci.tar",
        "checker.oci.tar",
        "worker-receipt.json"
      ]
    }
  },
  "serviceAccount": "projects/se-demos-project/serviceAccounts/deskdrop-build@se-demos-project.iam.gserviceaccount.com",
  "options": {
    "logging": "CLOUD_LOGGING_ONLY",
    "sourceProvenanceHash": [
      "SHA256"
    ]
  },
  "timeout": "1800s"
}
