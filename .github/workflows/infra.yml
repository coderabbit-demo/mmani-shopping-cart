name: Infrastructure
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.15.3
          terraform_wrapper: false
      - name: Format
        run: terraform fmt -check -recursive infra
      - name: Validate and test bootstrap
        working-directory: infra/bootstrap
        run: |
          terraform init -backend=false -lockfile=readonly -input=false
          terraform validate
          env -i PATH="$PATH" TF_IN_AUTOMATION=1 terraform test
      - name: Validate and test demo
        working-directory: infra/terraform
        run: |
          terraform init -backend=false -lockfile=readonly -input=false
          terraform validate
          env -i PATH="$PATH" TF_IN_AUTOMATION=1 terraform test
